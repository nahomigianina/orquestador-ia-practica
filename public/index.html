<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build with AI - Propuesta de Proyecto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #333; }
        textarea { width: 100%; height: 120px; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; }
        button { background-color: #4285F4; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #357ae8; }
        #response { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; white-space: pre-wrap; }
        .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gira Build with AI</h2>
    <p>Envía tu propuesta de proyecto de IA para ser evaluada por el servidor orquestador.</p>
    
    <form id="aiForm">
        <label for="proposal">Propuesta del Proyecto:</label>
        <textarea id="proposal" name="proposal" placeholder="Describe tu proyecto aquí (mínimo 10 palabras)..." required></textarea>
        <button type="submit">Enviar al Servidor</button>
    </form>

    <div id="response"></div>
</div>

<script>
    document.getElementById('aiForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const proposalText = document.getElementById('proposal').value;
        const responseDiv = document.getElementById('response');

        // Mensaje temporal de carga
        responseDiv.style.display = 'block';
        responseDiv.className = 'success';
        responseDiv.style.backgroundColor = '#f0f0f0';
        responseDiv.style.color = '#333';
        responseDiv.style.border = '1px solid #ccc';
        responseDiv.innerHTML = `<strong>⏳ Procesando:</strong> Conectando con Gemini en la nube...`;

        try {
            const res = await fetch('/api/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ proposal: proposalText })
            });

            const data = await res.json();

            responseDiv.style.display = 'block';
            if (res.ok) {
                // Cambiamos a los estilos verdes originales
                responseDiv.style.backgroundColor = ''; 
                responseDiv.style.color = '';
                responseDiv.style.border = '';
                responseDiv.className = 'success';
                
                // 🟢 Aquí se integra el data.aiResponse modificado para la Unidad 5:
                responseDiv.innerHTML = `<strong>🟢 Servidor:</strong> ${data.message}<br><strong>Palabras:</strong> ${data.wordCount}<br><br><strong>Veredicto de Gemini IA:</strong><br>${data.aiResponse}`;
            } else {
                responseDiv.style.backgroundColor = ''; 
                responseDiv.style.color = '';
                responseDiv.style.border = '';
                responseDiv.className = 'error';
                responseDiv.innerHTML = `<strong>🔴 Error:</strong> ${data.error}`;
            }
        } catch (err) {
            responseDiv.style.backgroundColor = ''; 
            responseDiv.style.color = '';
            responseDiv.style.border = '';
            responseDiv.style.display = 'block';
            responseDiv.className = 'error';
            responseDiv.innerHTML = `<strong>🔴 Error:</strong> No se pudo conectar con el servidor.`;
        }
    });
</script>
</body>
</html>
